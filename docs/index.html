<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MetVlc · Grandes incendios forestales CV</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f9f9fe;color:#263238}.page{max-width:1200px;margin:25px auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.14)}.header{background:linear-gradient(135deg,#0b2f4f 0%,#0b6fa4 65%,#ff6a2a 100%);color:white;padding:18px 24px;text-align:center}.header h1{margin:0;font-size:25px;letter-spacing:.4px;text-transform:uppercase}.header p{margin:6px 0 0;font-size:14px;color:#e8f5ff}.controls{display:grid;grid-template-columns:1.2fr .8fr .8fr .8fr .8fr auto;gap:10px;align-items:end;padding:14px;background:#f6f9fb;border-bottom:1px solid #dfe8ee}.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:12px;font-weight:700;color:#344955}.field input,.field select{border:1px solid #cfd8dc;border-radius:9px;padding:8px 10px;font-size:13px;background:#fff}.controls button{border:0;padding:9px 14px;border-radius:10px;background:#0b2f4f;color:white;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12);transition:.2s}.controls button:hover{background:#14527d}#map{width:100%;height:720px;background:#dce8ee}.legend{padding:14px 18px;background:#fff;border-top:1px solid #dfe8ee;font-size:14px;line-height:1.8;text-align:center}.legend span{display:inline-block;width:18px;height:14px;margin-right:6px;vertical-align:middle;border:1px solid rgba(0,0,0,.15);border-radius:3px}.meta{font-size:13px;color:#51636d;padding:0 18px 18px;background:#fff;text-align:center;line-height:1.5}.popup-title{font-weight:800;color:#0b2f4f;font-size:15px;margin-bottom:5px}.popup-area{font-weight:800;font-size:16px;color:#b71c1c}.leaflet-control-layers{border-radius:10px!important;box-shadow:0 4px 14px rgba(0,0,0,.18)!important;font-size:13px}@media(max-width:900px){.header h1{font-size:21px}.controls{grid-template-columns:1fr 1fr}.controls button{grid-column:1/-1}#map{height:560px}.legend{font-size:13px}}
  </style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>Grandes incendios forestales · Comunitat Valenciana</h1>
    <p>Perímetros históricos actualizados hasta 2024 · Superficie ≥ 500 ha</p>
  </div>
  <div class="controls">
    <div class="field"><label>Buscar incendio, municipio o paraje</label><input id="search" type="text" placeholder="Ej.: Bejís, Llutxent, Vall d'Ebo..." /></div>
    <div class="field"><label>Año desde</label><select id="yearFrom"></select></div>
    <div class="field"><label>Año hasta</label><select id="yearTo"></select></div>
    <div class="field"><label>Década</label><select id="decade"><option value="all">Todas</option></select></div>
    <div class="field"><label>Superficie mínima</label><select id="areaMin"><option value="500">≥ 500 ha</option><option value="1000">≥ 1.000 ha</option><option value="2500">≥ 2.500 ha</option><option value="5000">≥ 5.000 ha</option><option value="10000">≥ 10.000 ha</option></select></div>
    <button onclick="resetFilters()">Limpiar</button>
  </div>
  <div id="map"></div>
  <div class="legend" id="legend"></div>
  <div class="meta" id="metadata">Cargando datos...</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let allData=null;let fireLayer=null;
const map=L.map('map',{preferCanvas:true,zoomControl:true}).setView([39.5,-0.5],8);
const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'});
const esriTopo=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Tiles &copy; Esri'});
const esriSat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Tiles &copy; Esri'});
esriTopo.addTo(map);
L.control.layers({'Relieve · Esri':esriTopo,'Satélite · Esri':esriSat,'Calles · OSM':osm},null,{collapsed:false}).addTo(map);
const colors={'1990s':'#7b3294','2000s':'#008837','2010s':'#fdae61','2020s':'#d7191c'};
function colorFor(d){return colors[d]||'#666'}
function normalize(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function popup(p){return `<div class="popup-title">${p.titulo||'Incendio'}</div><b>Año:</b> ${p.anyo||'—'}<br><b>Municipio:</b> ${p.municipio||'—'}<br><b>Paraje:</b> ${p.paraje||'—'}<br><b>Provincia:</b> ${p.provincia||'—'}<br><b>Superficie:</b> <span class="popup-area">${Number(p.superficie_ha).toLocaleString('es-ES')} ha</span><br><b>Parte:</b> ${p.numparte||'—'}`}
function style(f){const p=f.properties;return{color:colorFor(p.decada),weight:1.4,opacity:.95,fillColor:colorFor(p.decada),fillOpacity:.43}}
function populateFilters(){const years=[...new Set(allData.features.map(f=>f.properties.anyo))].sort((a,b)=>a-b);const decades=[...new Set(allData.features.map(f=>f.properties.decada))].sort();const yf=document.getElementById('yearFrom'),yt=document.getElementById('yearTo'),de=document.getElementById('decade');yf.innerHTML='';yt.innerHTML='';years.forEach(y=>{yf.add(new Option(y,y));yt.add(new Option(y,y));});yf.value=years[0];yt.value=years[years.length-1];decades.forEach(d=>de.add(new Option(d,d)));}
function filteredFeatures(){const q=normalize(document.getElementById('search').value);const yf=Number(document.getElementById('yearFrom').value);const yt=Number(document.getElementById('yearTo').value);const dec=document.getElementById('decade').value;const amin=Number(document.getElementById('areaMin').value);return allData.features.filter(f=>{const p=f.properties;const hay=normalize(`${p.municipio} ${p.paraje} ${p.titulo} ${p.numparte} ${p.provincia}`);return Number(p.anyo)>=yf&&Number(p.anyo)<=yt&&(dec==='all'||p.decada===dec)&&Number(p.superficie_ha)>=amin&&(!q||hay.includes(q));});}
function draw(){if(fireLayer)map.removeLayer(fireLayer);const feats=filteredFeatures();fireLayer=L.geoJSON({type:'FeatureCollection',features:feats},{style,onEachFeature:(f,l)=>l.bindPopup(popup(f.properties))}).addTo(map);if(feats.length&&fireLayer.getBounds().isValid())map.fitBounds(fireLayer.getBounds(),{padding:[20,20]});const totalArea=feats.reduce((s,f)=>s+Number(f.properties.superficie_ha||0),0);document.getElementById('metadata').innerHTML=`<b>Incendios mostrados:</b> ${feats.length} de ${allData.features.length} · <b>Superficie mostrada:</b> ${Math.round(totalArea).toLocaleString('es-ES')} ha<br>Fuente: capa SHP facilitada · Selección: incendios con superficie ≥ 500 ha · Visor Leaflet para MetVlc.`;}
function resetFilters(){document.getElementById('search').value='';document.getElementById('decade').value='all';document.getElementById('areaMin').value='500';populateFilters();draw();}
function buildLegend(){document.getElementById('legend').innerHTML='<b>Color por década:</b> '+Object.entries(colors).map(([d,c])=>`&nbsp;&nbsp;<span style="background:${c}"></span>${d}`).join('')}
['search','yearFrom','yearTo','decade','areaMin'].forEach(id=>document.addEventListener('input',e=>{if(e.target&&e.target.id===id)draw()}));
fetch('incendios_cv_perimetros.geojson?v='+Date.now()).then(r=>{if(!r.ok)throw new Error('No se pudo cargar el GeoJSON');return r.json()}).then(data=>{allData=data;populateFilters();buildLegend();draw();}).catch(err=>{console.error(err);document.getElementById('metadata').innerHTML='Error al cargar incendios_cv_perimetros.geojson';});
</script>
</body>
</html>
